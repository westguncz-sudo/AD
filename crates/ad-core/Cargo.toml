[package]
name = "ad-core"
description = "Sdilene jadro: datovy model, protokol, zasady, hesla"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5.3"
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
subtle = "2.6.1"
thiserror = "2.0.21"
time = { version = "0.3.44", features = ["formatting", "parsing", "macros", "serde-well-known"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
zeroize = "1.8.2"
