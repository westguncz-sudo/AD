# Překlad, kontroly a vydání.
#
# Všechny čtyři binárky se překládají na Linuxu: ty pro Windows křížově
# přes mingw. Ověřili jsme, že výsledná .exe nepotřebují žádnou
# přibalenou knihovnu, takže se tím nic neztrácí — a sestavení je
# v jednom prostředí, tedy snáz zopakovatelné.

name: Sestavení

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Na CI nepotřebujeme ladicí informace, jen výsledek.
  CARGO_PROFILE_RELEASE_DEBUG: "false"

jobs:
  kontrola:
    name: Testy a kontroly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable

      - name: Mezipaměť cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-kontrola-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-kontrola-${{ runner.os }}-

      - name: Formátování
        run: cargo fmt --all --check

      - name: Clippy (varování = chyba)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Jednotkové testy
        run: cargo test --workspace

      - name: Kontrola JavaScriptu rozhraní
        working-directory: crates/ad-server/web
        run: npx --yes eslint js/

  testy-nanecisto:
    name: Testy fází na jednom stroji
    runs-on: ubuntu-latest
    needs: kontrola
    steps:
      - uses: actions/checkout@v4

      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Mezipaměť cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-testy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-testy-${{ runner.os }}-

      - name: Nástroje pro testy
        run: |
          sudo apt-get update
          sudo apt-get install -y jq bind9-dnsutils
          # Playwright musí být v projektu, ne globálně — test rozhraní
          # ho hledá přes import z adresáře docs/.
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Fáze 2 — server, doména, přihlášení
        run: bash docs/test-faze2.sh

      - name: Fáze 3 — webové rozhraní v prohlížeči
        run: bash docs/test-faze3.sh

      - name: Fáze 4 — DNS server
        run: bash docs/test-faze4.sh

      - name: Fáze 5 — klient a zásady
        run: bash docs/test-faze5.sh

      - name: Fáze 6 — služba (nanečisto)
        run: bash docs/test-faze6.sh

      - name: Uložit snímky obrazovky z testu rozhraní
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snimky-rozhrani
          path: data-test-ui/snimky/
          if-no-files-found: ignore
          retention-days: 14

  sestaveni:
    name: Binárky a index.html
    runs-on: ubuntu-latest
    needs: kontrola
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust a cílové platformy
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl x86_64-pc-windows-gnu

      - name: Překladače pro musl a Windows
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools mingw-w64

      - name: Mezipaměť cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-vydani-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-vydani-${{ runner.os }}-

      - name: Sestavení a kontrolní součty
        run: bash scripts/sestav-vydani.sh

      - name: Uložit výsledek
        uses: actions/upload-artifact@v4
        with:
          name: ad-vydani
          path: |
            dist/ad-server.exe
            dist/ad-client.exe
            dist/ad-server-linux
            dist/ad-client-linux
            dist/SHA256SUMS
            dist/index.html
          retention-days: 30

  vydani:
    name: Zveřejnění vydání
    runs-on: ubuntu-latest
    needs: [sestaveni, testy-nanecisto]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Stáhnout sestavené soubory
        uses: actions/download-artifact@v4
        with:
          name: ad-vydani
          path: dist

      - name: Přegenerovat index.html s odkazy na vydání
        run: |
          ZAKLAD="${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/"
          sed -i "s|href=\"ad-|href=\"${ZAKLAD}ad-|g; s|href=\"SHA256SUMS|href=\"${ZAKLAD}SHA256SUMS|g" \
            dist/index.html
          grep -c "releases/download" dist/index.html

      - name: Popis vydání
        run: |
          {
            echo "Sestaveno z revize ${{ github.sha }}."
            echo
            echo "## Kontrolní součty"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "Ověření: \`sha256sum -c SHA256SUMS\` na Linuxu,"
            echo "\`Get-FileHash .\\ad-server.exe -Algorithm SHA256\` na Windows."
            echo
            echo "Návod ke stažení a instalaci je v příloze \`index.html\`."
          } > popis.md
          cat popis.md

      - name: Vytvořit vydání
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "ad ${{ github.ref_name }}" \
            --notes-file popis.md \
            dist/ad-server.exe \
            dist/ad-client.exe \
            dist/ad-server-linux \
            dist/ad-client-linux \
            dist/SHA256SUMS \
            dist/index.html
